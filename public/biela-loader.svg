<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Generating image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1830"/>
      <stop offset="50%" stop-color="#2a2148"/>
      <stop offset="100%" stop-color="#0f0e1f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#635BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="url(#glow)">
    <animate attributeName="r" values="160;200;160" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(200 200)">
    <circle r="48" fill="none" stroke="#3a3550" stroke-width="4"/>
    <circle r="48" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="60 240" transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#635BFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="200" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#9ca3af" letter-spacing="2">
    GENERATING IMAGE
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
